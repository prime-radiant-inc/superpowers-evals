name: pi
binary: pi
# Collapse PI_CODING_AGENT_DIR into the throwaway $HOME: pi defaults its config
# dir to $HOME/.pi/agent (PI_CODING_AGENT_DIR unset), where provisioning seeds
# its config. The launcher selects the sessions subdirectory explicitly so a
# deep launch cwd is not encoded into one filesystem component.
home_config_subdir: ".pi/agent"
session_log_dir: "${QUORUM_AGENT_HOME}/.pi/agent/sessions"
# The main session is written at the explicit session root. Child sessions can
# still be nested below it, so discovery remains recursive. The cwd-filter keys
# off each file's first-line `cwd`, not the path depth.
session_log_glob: "**/*.jsonl"
normalizer: pi
# Auth is OAuth-or-env (PiAgent.provision): PI_PROVIDER/PI_MODEL/PI_API_KEY are
# only needed for the api-key path; an OAuth login under ~/.pi works without
# them. The "neither oauth nor env" failure is raised in provision() with a
# clear message, not by the loader's required_env check.
required_env:
  - SUPERPOWERS_ROOT
max_time: 10m
# Default to OpenAI gpt-5.5 via openai-codex (ChatGPT subscription). openrouter_glm_5_2
# remains an opt-in alternative (--credential openrouter_glm_5_2).
default_credential: pi_default
