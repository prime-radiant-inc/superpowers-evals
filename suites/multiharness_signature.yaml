# Finite multiharness_signature measurement. Register a fresh identity for every execution.
# Historical names do not enable gating, repair, or continuation.
# Grader requires a distinct ANTHROPIC_API_KEY; subject keys must differ.
# Different models/endpoints make this an end-to-end stack comparison.
schema_version: 2
name: multiharness_signature
grader:
  credential: sonnet5
  model: claude-sonnet-5
comparisons:
  - baseline: claude_opus5_bedrock_main
    treatment: codex_gpt56sol_openai_main
    scenarios: tier=sentinel
    n: 3
  - baseline: claude_opus5_bedrock_main
    treatment: pi_gpt56sol_openai_main
    scenarios: tier=sentinel
    n: 3
  - baseline: claude_opus5_bedrock_main
    treatment: codex_gpt56sol_openai_main
    scenarios:
      - sdd-breaker-rules-and-continues
    n: 3
  - baseline: claude_opus5_bedrock_main
    treatment: pi_gpt56sol_openai_main
    scenarios:
      - sdd-breaker-rules-and-continues
    n: 3
reserve: 2
max_exposure_skew: 60
attempt_bounds:
  max_attempts: 2
  max_time_s: 1800
