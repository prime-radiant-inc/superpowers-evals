# Finite opus5_signature measurement. Register a fresh identity for every execution.
# Historical names do not enable gating, repair, or continuation.
# Grader requires a distinct ANTHROPIC_API_KEY; subject keys must differ.
schema_version: 2
name: opus5_signature
grader:
  credential: sonnet5
  model: claude-sonnet-5
comparisons:
  - baseline: claude_opus_bedrock_main
    treatment: claude_opus5_bedrock_main
    scenarios: tier=sentinel
    n: 5
  - baseline: claude_opus_bedrock_main
    treatment: claude_opus5_bedrock_main
    scenarios:
      - sdd-breaker-rules-and-continues
    n: 3
reserve: 2
max_exposure_skew: 60
attempt_bounds:
  max_attempts: 2
  max_time_s: 1800
